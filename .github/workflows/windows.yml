name: Windows capture and editor
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Layer
        run: python -m pip install .
      - name: Install verified FFmpeg build
        run: |
          $archive = Join-Path $env:RUNNER_TEMP ffmpeg.zip
          $destination = Join-Path $env:RUNNER_TEMP layer-ffmpeg
          $url = 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-full_build.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '759d0a9831c436a0eb331ad36f236c06cb04aaa0005da46571f0e9d3d9206f6b') {
            throw 'FFmpeg archive SHA256 mismatch.'
          }
          Expand-Archive $archive -DestinationPath $destination
          Join-Path $destination 'ffmpeg-9.0.2-full_build/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Test capture pipeline and project export
        run: python -m unittest discover -s tests -p test_windows_capture.py -v
      - name: Test native Studio
        run: |
          $env:LAYER_PYTHON = (Get-Command python).Source
          cargo test --locked --manifest-path native/editor/Cargo.toml
      - name: Build Layer Studio for distribution
        if: github.event_name == 'push'
        run: ./tools/build-windows.ps1
      - name: Package the Windows build
        if: github.event_name == 'push'
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'Layer-Windows-x64'
          New-Item -ItemType Directory -Path "$package/bin", "$package/docs", "$package/tools" | Out-Null
          Copy-Item -Recurse katman, licenses -Destination $package
          Copy-Item pyproject.toml, MANIFEST.in, README.md, LICENSE, NOTICE.md, Layer.cmd -Destination $package
          Copy-Item docs/WINDOWS.md -Destination "$package/docs"
          Copy-Item tools/install-windows.ps1 -Destination "$package/tools"
          Copy-Item bin/layer-studio.exe -Destination "$package/bin"
          git archive --format=zip --prefix=layer-recorder-source/ -o "$package/Layer-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not package the corresponding source.' }
          Compress-Archive -Path $package -DestinationPath Layer-Windows-x64.zip
          (Get-FileHash Layer-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() + '  Layer-Windows-x64.zip' |
            Set-Content Layer-Windows-x64.zip.sha256 -Encoding ascii
      - name: Upload Windows build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: Layer-Windows-x64
          path: |
            Layer-Windows-x64.zip
            Layer-Windows-x64.zip.sha256
          if-no-files-found: error
