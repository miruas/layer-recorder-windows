name: Windows capture
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Layer
        run: python -m pip install .
      - name: Check FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Test capture pipeline and project export
        run: python -m unittest discover -s tests -p test_windows_capture.py -v
