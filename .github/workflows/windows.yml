name: Windows capture and editor
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Layer
        run: python -m pip install .
      - name: Install verified FFmpeg build
        run: |
          $archive = Join-Path $env:RUNNER_TEMP ffmpeg.zip
          $destination = Join-Path $env:RUNNER_TEMP layer-ffmpeg
          $url = 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-full_build.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '759d0a9831c436a0eb331ad36f236c06cb04aaa0005da46571f0e9d3d9206f6b') {
            throw 'FFmpeg archive SHA256 mismatch.'
          }
          Expand-Archive $archive -DestinationPath $destination
          Join-Path $destination 'ffmpeg-9.0.2-full_build/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Test capture pipeline and project export
        run: |
          cargo test --locked --manifest-path native/windows-capture/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --manifest-path native/windows-capture/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:LAYER_CAPTURE_BINARY = (Resolve-Path native/windows-capture/target/debug/layer-capture.exe).Path
          python -m unittest discover -s tests -p test_windows_capture.py -v
      - name: Test Voice Control
        run: python -m unittest discover -s tests -p test_windows_voice.py -v
      - name: Test native Studio
        run: |
          $env:LAYER_PYTHON = (Get-Command python).Source
          cargo test --locked --manifest-path native/editor/Cargo.toml
      - name: Build Layer Studio for distribution
        if: github.event_name == 'push'
        run: ./tools/build-windows.ps1
      - name: Install the native overlay toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          location: '${{ runner.temp }}/layer-msys2'
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-pango mingw-w64-ucrt-x86_64-mesa
        id: overlay-toolchain
      - name: Build and test the original GSR overlay
        run: |
          & {
            ./tools/test-gsr-windows-widgets.ps1 -Toolchain "${{ steps.overlay-toolchain.outputs.msys2-location }}/ucrt64/bin" -OverlayDirectory build/native/windows-overlay-package/overlay -SoftwareOpenGL
          } *>&1 | Tee-Object -FilePath overlay-build.log
      - name: Upload overlay build diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-overlay-build-log
          path: overlay-build.log
          if-no-files-found: ignore
      - name: Verify overlay settings survive closing
        run: ./tools/test-gsr-windows-overlay.ps1 -Toolchain "${{ steps.overlay-toolchain.outputs.msys2-location }}/ucrt64/bin" -OverlayDirectory build/native/windows-overlay-package/overlay -CloseSettings -SoftwareOpenGL
      - name: Verify the open overlay updates capture state
        run: ./tools/test-gsr-windows-overlay.ps1 -Toolchain "${{ steps.overlay-toolchain.outputs.msys2-location }}/ucrt64/bin" -OverlayDirectory build/native/windows-overlay-package/overlay -LiveCaptureState -SoftwareOpenGL
      - name: Package the Windows build
        if: github.event_name == 'push'
        run: ./tools/package-windows.ps1 -Output .
      - name: Verify the packaged Windows build
        if: github.event_name == 'push'
        run: |
          $archive = 'Layer-Windows-x64.zip'
          $hash = (Get-Content "$archive.sha256") -split ' '
          if ((Get-FileHash $archive).Hash -ne $hash[0]) { throw 'Windows archive checksum mismatch.' }
          $destination = Join-Path $env:RUNNER_TEMP 'layer-portable-test'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          Push-Location "$destination/Layer-Windows-x64"
          try {
            python -m katman doctor
            if ($LASTEXITCODE -ne 0) { throw 'The packaged Windows capture environment is incomplete.' }
            foreach ($file in 'bin/layer-studio.exe', 'overlay/layer-gsr-overlay.exe', 'Layer-source.zip') {
              if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing packaged file: $file" }
            }
          } finally {
            Pop-Location
          }
      - name: Upload Windows build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: Layer-Windows-x64
          path: |
            Layer-Windows-x64.zip
            Layer-Windows-x64.zip.sha256
          if-no-files-found: error
      - name: Build Windows Setup
        if: github.event_name == 'push'
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ./tools/build-windows-installer.ps1 -PythonRoot $env:pythonLocation -Stage "$env:RUNNER_TEMP/layer-setup-stage" -Output . -Compiler $compiler
      - name: Upload Windows Setup
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: Layer-Setup-x64
          path: |
            Layer-Setup-x64.exe
            Layer-Setup-x64.exe.sha256
          if-no-files-found: error
