[package]
name = "layer-capture"
version = "0.8.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "layer"
path = "src/launcher.rs"
